name: First Workflow

on:
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: "Setup Node.js in VM"
        uses: actions/setup-node@v4
        with:
          node-version: 24 
          cache: npm


      - name: Install Dependencies
        run: npm ci

      - name: run ESLint in app
        run: npm run lint

      - name: run test cases
        run: npm run test:run


      - name: Build Project
        run: npm run build