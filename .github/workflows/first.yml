name: First Workflow

on:
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa

jobs:
  lint-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: "Setup Node.js in VM"
        uses: actions/setup-node@v4
        with:
          node-version: 24 
          cache: npm


      - name: Install Dependencies
        run: npm ci

      - name: run ESLint in app
        run: npm run lint

  test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: "Setup Node.js in VM"
        uses: actions/setup-node@v4
        with:
          node-version: 24 
          cache: npm


      - name: Install Dependencies
        run: npm ci

      - name: run test cases
        run: npm run test:run

  build-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: "Setup Node.js in VM"
        uses: actions/setup-node@v4
        with:
          node-version: 24 
          cache: npm


      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: create artifacts 
        uses: actions/upload-artifact@v4
        with:
            name: react-build
            path: dist/
            retention-days: 8



